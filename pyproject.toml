[project]
name = "pitch-tracker"
version = "0.1.0"
description = "A guitar tuner: pitch estimation from a microphone"
authors = [
    { name = "lorenzoliuzzo" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pitch-record = "pitch_tracker.record:main"
pitch-demo = "pitch_tracker.demo:main"
pitch-tuner = "pitch_tracker.live:main"
pitch-vectors = "pitch_tracker.vectors:main"
